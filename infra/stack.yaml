services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hands_on_internal
    deploy:
      restart_policy:
        condition: on-failure

  n8n:
    image: n8nio/n8n:1.107.4
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      N8N_HOST: ${HANDS_ON_DOMAIN:?HANDS_ON_DOMAIN is required}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      N8N_EDITOR_BASE_URL: https://${HANDS_ON_DOMAIN}/
      WEBHOOK_URL: https://${HANDS_ON_DOMAIN}/
      N8N_PROXY_HOPS: 1
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      N8N_SECURE_COOKIE: "true"
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      EXECUTIONS_DATA_PRUNE: ${EXECUTIONS_DATA_PRUNE:-true}
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Fortaleza}
      FIGMA_WEBHOOK_PASSCODE: ${FIGMA_WEBHOOK_PASSCODE:?FIGMA_WEBHOOK_PASSCODE is required}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:?DISCORD_CHANNEL_ID is required}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - hands_on_internal
      - rosarede
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=rosarede
        - traefik.http.routers.hands-on.rule=Host(`${HANDS_ON_DOMAIN}`)
        - traefik.http.routers.hands-on.entrypoints=websecure
        - traefik.http.routers.hands-on.tls=true
        - traefik.http.routers.hands-on.tls.certresolver=letsencryptresolver
        - traefik.http.services.hands-on.loadbalancer.server.port=5678

networks:
  hands_on_internal:
    driver: overlay
    attachable: true
  rosarede:
    external: true

volumes:
  postgres_data:
  n8n_data:
